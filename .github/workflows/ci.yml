name: ci
on: [push, pull_request]
jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: pip install -e portal/backend pytest jsonschema pyyaml
      - run: python -m compileall portal/backend/app connectors
      - run: PYTHONPATH=. python -m pytest portal/backend/tests tests/connectors tests/scripts
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: {terraform_version: '1.14.5'}
      - run: terraform -chdir=terraform/envs/lab fmt -check -recursive
      - run: terraform -chdir=terraform/envs/lab init -backend=false -input=false
      - run: terraform -chdir=terraform/envs/lab validate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22'}
      - run: cd portal/frontend && npm ci && npm test && npm run build
      - run: docker build portal/backend && docker build portal/frontend
