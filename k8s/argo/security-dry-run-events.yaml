apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-dry-run-sensor
  namespace: security-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: security-dry-run-workflow
  namespace: security-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-dry-run-workflow-submit
  namespace: security-lab
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtemplates"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-dry-run-workflow-submit
  namespace: security-lab
subjects:
  - kind: ServiceAccount
    name: security-dry-run-sensor
    namespace: security-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: security-dry-run-workflow-submit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: security-dry-run-workflow-executor
  namespace: security-lab
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: security-dry-run-workflow-executor
  namespace: security-lab
subjects:
  - kind: ServiceAccount
    name: security-dry-run-workflow
    namespace: security-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: security-dry-run-workflow-executor
---
apiVersion: argoproj.io/v1alpha1
kind: EventBus
metadata:
  name: security-dry-run
  namespace: security-lab
spec:
  nats:
    native:
      replicas: 1
---
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: security-portal-webhook
  namespace: security-lab
spec:
  eventBusName: security-dry-run
  service:
    ports:
      - port: 12000
        targetPort: 12000
  webhook:
    dry-run-action:
      endpoint: /dry-run-action
      method: POST
      port: "12000"
---
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: security-dry-run-sensor
  namespace: security-lab
spec:
  eventBusName: security-dry-run
  template:
    serviceAccountName: security-dry-run-sensor
  dependencies:
    - name: portal-dry-run
      eventSourceName: security-portal-webhook
      eventName: dry-run-action
  triggers:
    - template:
        name: security-dry-run-workflow
        argoWorkflow:
          operation: submit
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: security-dry-run-
                namespace: security-lab
              spec:
                serviceAccountName: security-dry-run-workflow
                workflowTemplateRef:
                  name: security-dry-run-remediation
                arguments:
                  parameters:
                    - name: action_id
                      value: default-action
                    - name: target_id
                      value: selected-context
                    - name: reason
                      value: portal dry-run
          parameters:
            - src:
                dependencyName: portal-dry-run
                dataKey: body.action_id
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: portal-dry-run
                dataKey: body.target_id
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: portal-dry-run
                dataKey: body.reason
              dest: spec.arguments.parameters.2.value
