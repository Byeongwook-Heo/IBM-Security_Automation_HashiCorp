# Overlay for prometheus-community/prometheus 29.17.0.
# Receiver credentials remain in alertmanager-notification-secrets and are
# consumed only by the internal notification relay.
alertmanager:
  enabled: true
  automountServiceAccountToken: false
  persistence:
    enabled: false
    emptyDir:
      sizeLimit: 128Mi
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  podSecurityContext:
    runAsUser: 65534
    runAsNonRoot: true
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsUser: 65534
    runAsNonRoot: true
    runAsGroup: 65534
  config:
    enabled: true
    global: {}
    route:
      receiver: notification-relay
      group_by:
        - alertname
        - namespace
        - source
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: notification-relay
          matchers:
            - severity="critical"
          repeat_interval: 1h
    receivers:
      - name: notification-relay
        webhook_configs:
          - url: http://alertmanager-notification-relay.security-lab.svc.cluster.local:8080/alerts
            send_resolved: true

prometheus-pushgateway:
  enabled: true
  persistentVolume:
    enabled: false
  serviceAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9091"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 192Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
