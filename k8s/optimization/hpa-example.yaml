apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: security-portal-backend
  namespace: security-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: security-portal-backend
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
