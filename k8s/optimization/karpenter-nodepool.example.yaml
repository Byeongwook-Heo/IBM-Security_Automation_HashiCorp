apiVersion: v1
kind: ConfigMap
metadata:
  name: karpenter-nodepool-review-template
  namespace: security-lab
  labels:
    app.kubernetes.io/name: karpenter-nodepool-review-template
    app.kubernetes.io/part-of: information-security-portal
data:
  nodepool.yaml: |
    apiVersion: karpenter.sh/v1
    kind: NodePool
    metadata:
      name: security-lab-default
    spec:
      disruption:
        consolidationPolicy: WhenEmptyOrUnderutilized
        consolidateAfter: 5m
      limits:
        cpu: "64"
        memory: 128Gi
      template:
        metadata:
          labels:
            workload-tier: security-lab
        spec:
          nodeClassRef:
            group: karpenter.k8s.aws
            kind: EC2NodeClass
            name: security-lab-default
          requirements:
            - key: kubernetes.io/arch
              operator: In
              values: ["amd64"]
            - key: kubernetes.io/os
              operator: In
              values: ["linux"]
            - key: karpenter.sh/capacity-type
              operator: In
              values: ["on-demand"]
            - key: node.kubernetes.io/instance-type
              operator: In
              values: ["t3.large", "t3.xlarge", "m6i.large", "m6i.xlarge"]
    ---
    apiVersion: karpenter.k8s.aws/v1
    kind: EC2NodeClass
    metadata:
      name: security-lab-default
    spec:
      amiFamily: Custom
      amiSelectorTerms:
        - name: hc-security-base-*
          owner: "888995627335"
        - name: hc-base-*
          owner: "888995627335"
      role: KarpenterNodeRole-existing-cluster
      subnetSelectorTerms:
        - tags:
            karpenter.sh/discovery: existing-cluster
      securityGroupSelectorTerms:
        - tags:
            karpenter.sh/discovery: existing-cluster
      tags:
        owner: security-lab
        managed_by: karpenter
