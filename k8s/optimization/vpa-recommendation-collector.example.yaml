apiVersion: v1
kind: ServiceAccount
metadata:
  name: vpa-recommendation-reader
  namespace: security-lab
  labels:
    app.kubernetes.io/name: vpa-recommendation-export
    app.kubernetes.io/part-of: information-security-portal
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vpa-recommendation-reader
  namespace: security-lab
  labels:
    app.kubernetes.io/name: vpa-recommendation-export
    app.kubernetes.io/part-of: information-security-portal
rules:
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vpa-recommendation-reader
  namespace: security-lab
  labels:
    app.kubernetes.io/name: vpa-recommendation-export
    app.kubernetes.io/part-of: information-security-portal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vpa-recommendation-reader
subjects:
  - kind: ServiceAccount
    name: vpa-recommendation-reader
    namespace: security-lab
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vpa-recommendation-export
  namespace: security-lab
  labels:
    app.kubernetes.io/name: vpa-recommendation-export
    app.kubernetes.io/part-of: information-security-portal
    optimization.security-lab/mode: recommendation-only
  annotations:
    optimization.security-lab/output: stdout-tsv
spec:
  schedule: "37 */6 * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: vpa-recommendation-export
        optimization.security-lab/mode: recommendation-only
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vpa-recommendation-export
            app.kubernetes.io/part-of: information-security-portal
            optimization.security-lab/mode: recommendation-only
        spec:
          serviceAccountName: vpa-recommendation-reader
          automountServiceAccountToken: true
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kubectl
              image: registry.k8s.io/kubectl:v1.36.0
              imagePullPolicy: IfNotPresent
              command: ["kubectl"]
              args:
                - get
                - verticalpodautoscalers.autoscaling.k8s.io
                - --namespace=$(POD_NAMESPACE)
                - --no-headers=true
                - --output=custom-columns=NAMESPACE:.metadata.namespace,VPA:.metadata.name,TARGET_KIND:.spec.targetRef.kind,TARGET:.spec.targetRef.name,CONTAINERS:.status.recommendation.containerRecommendations[*].containerName,TARGET_CPU:.status.recommendation.containerRecommendations[*].target.cpu,TARGET_MEMORY:.status.recommendation.containerRecommendations[*].target.memory,LOWER_CPU:.status.recommendation.containerRecommendations[*].lowerBound.cpu,LOWER_MEMORY:.status.recommendation.containerRecommendations[*].lowerBound.memory,UPPER_CPU:.status.recommendation.containerRecommendations[*].upperBound.cpu,UPPER_MEMORY:.status.recommendation.containerRecommendations[*].upperBound.memory
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: HOME
                  value: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 32Mi
