apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: security-lab-workload-baseline
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
        scope: Namespaced
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
  validations:
    - expression: >-
        variables.allContainers.all(container,
          !container.image.endsWith(':latest'))
      message: Container images must not use the mutable latest tag.
      reason: Invalid
    - expression: >-
        variables.allContainers.all(container,
          !has(container.securityContext) ||
          !has(container.securityContext.privileged) ||
          container.securityContext.privileged == false)
      message: Privileged containers are not allowed.
      reason: Forbidden
    - expression: >-
        (!has(object.spec.hostNetwork) || object.spec.hostNetwork == false) &&
        (!has(object.spec.hostPID) || object.spec.hostPID == false) &&
        (!has(object.spec.hostIPC) || object.spec.hostIPC == false)
      message: Host network, PID, and IPC namespaces are not allowed.
      reason: Forbidden
