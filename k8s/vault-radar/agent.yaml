apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-radar-agent
  namespace: security-lab
  labels:
    app.kubernetes.io/name: vault-radar-agent
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-radar-agent
  namespace: security-lab
  labels:
    app.kubernetes.io/name: vault-radar-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: vault-radar-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-radar-agent
    spec:
      serviceAccountName: vault-radar-agent
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        fsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: VAULT_RADAR_AGENT_IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          command: ["/bin/vault-radar"]
          args: ["agent", "exec"]
          env:
            - name: HCP_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: vault-radar-agent-credentials
                  key: hcp-project-id
            - name: HCP_RADAR_AGENT_POOL_ID
              valueFrom:
                secretKeyRef:
                  name: vault-radar-agent-credentials
                  key: hcp-radar-agent-pool-id
            - name: HCP_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: vault-radar-agent-credentials
                  key: hcp-client-id
            - name: HCP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vault-radar-agent-credentials
                  key: hcp-client-secret
            - name: VAULT_RADAR_LICENSE_PATH
              value: /var/run/vault-radar/vault-radar.hclic
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: credentials
              mountPath: /var/run/vault-radar
              readOnly: true
            - name: runtime
              mountPath: /tmp
      volumes:
        - name: credentials
          secret:
            secretName: vault-radar-agent-credentials
            defaultMode: 0440
            items:
              - key: vault-radar.hclic
                path: vault-radar.hclic
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-radar-agent
  namespace: security-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault-radar-agent
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
