apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vault-radar-continuous-scan
  namespace: security-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault-radar-continuous-scan
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: security-lab
      ports:
        - protocol: TCP
          port: 9091
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 443
