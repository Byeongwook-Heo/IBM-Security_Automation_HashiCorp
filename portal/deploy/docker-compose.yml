services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend.env
    network_mode: host
    volumes:
      - portal-backend-data:/var/lib/security-portal

  oauth2-session:
    profiles: ["oidc"]
    image: redis:7.4-alpine
    restart: unless-stopped
    user: "999:1000"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--protected-mode", "no"]
    expose:
      - "6379"
    read_only: true
    tmpfs:
      - /data:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks:
      - oauth-session

  oauth2-proxy:
    profiles: ["oidc"]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    restart: unless-stopped
    user: "65532:65532"
    env_file: ./oauth2-proxy.env
    command: ["--trusted-proxy-ip=172.16.0.0/12"]
    depends_on:
      oauth2-session:
        condition: service_healthy
    expose:
      - "4180"
    volumes:
      - ./secrets/oidc-client-secret:/run/secrets/oidc-client-secret:ro
      - ./secrets/oidc-cookie-secret:/run/secrets/oidc-cookie-secret:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - oauth-session

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORTAL_PORT:-8080}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.0
    restart: unless-stopped
    user: root
    network_mode: host
    command: ["filebeat", "-e", "--strict.perms=false"]
    env_file: ./filebeat.env
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - filebeat-data:/usr/share/filebeat/data

volumes:
  portal-backend-data:
  filebeat-data:

networks:
  oauth-session:
    internal: true
