server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /api/workflows/actions/dry-run {
    proxy_pass http://host.docker.internal:8000/api/workflows/actions/dry-run;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-User-Email "portal-ui@lab.local";
    proxy_set_header X-User-Groups "SECURITY_ANALYST";
  }

  location = /api/assistant/chat {
    proxy_pass http://host.docker.internal:8000/api/assistant/chat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-User-Email "portal-ui@lab.local";
    proxy_set_header X-User-Groups "SECURITY_ANALYST";
  }

  location /api/ {
    proxy_pass http://host.docker.internal:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-User-Email "";
    proxy_set_header X-User-Groups "";
  }

  location /health {
    proxy_pass http://host.docker.internal:8000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location /metrics {
    proxy_pass http://host.docker.internal:8000/metrics;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
