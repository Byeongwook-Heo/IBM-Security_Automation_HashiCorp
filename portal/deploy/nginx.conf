map $http_x_forwarded_proto $portal_forwarded_proto {
  default $scheme;
  "~*^https$" https;
}

map $uri $portal_oauth2_redirect {
  default $request_uri;
  /oauth2/sign_out /;
}

server {
  listen 80;
  server_name _;
  absolute_redirect off;

  proxy_buffer_size 16k;
  proxy_buffers 8 16k;
  proxy_busy_buffers_size 32k;

  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=30s ipv6=off;
  set $oauth2_proxy_upstream http://oauth2-proxy:4180;

  auth_request __PORTAL_AUTH_REQUEST__;
  auth_request_set $auth_user_email $upstream_http_x_auth_request_email;
  auth_request_set $auth_user_groups $upstream_http_x_auth_request_groups;
  auth_request_set $auth_cookie $upstream_http_set_cookie;
  add_header Set-Cookie $auth_cookie always;

  error_page 401 = @oauth2_start;

  location @oauth2_start {
    auth_request off;
    return 302 /oauth2/start?rd=$request_uri;
  }

  location @api_auth_required {
    auth_request off;
    default_type application/json;
    return 401 '{"detail":"authentication required"}';
  }

  location = /oauth2/auth {
    auth_request off;
    internal;
    proxy_pass $oauth2_proxy_upstream;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $portal_forwarded_proto;
    proxy_set_header X-Forwarded-Uri $request_uri;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
    proxy_set_header X-Auth-Request-User "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-Groups "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Forwarded-Email "";
    proxy_set_header X-Forwarded-Groups "";
    proxy_set_header X-User-Email "";
    proxy_set_header X-User-Groups "";
    proxy_set_header Authorization "";
  }

  location /oauth2/ {
    auth_request off;
    # The OIDC start and callback endpoints must be public; the upstream is fixed.
    proxy_pass $oauth2_proxy_upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $portal_forwarded_proto;
    proxy_set_header X-Auth-Request-Redirect $portal_oauth2_redirect;
    proxy_set_header X-Auth-Request-User "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-Groups "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Forwarded-Email "";
    proxy_set_header X-Forwarded-Groups "";
    proxy_set_header X-User-Email "";
    proxy_set_header X-User-Groups "";
    proxy_set_header Authorization "";
  }

  location = /api/workflows/actions/dry-run {
    error_page 401 = @api_auth_required;
    proxy_pass http://host.docker.internal:8000/api/workflows/actions/dry-run;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $portal_forwarded_proto;
    proxy_set_header X-User-Email __PORTAL_PRIVILEGED_EMAIL__;
    proxy_set_header X-User-Groups __PORTAL_PRIVILEGED_GROUPS__;
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-Groups "";
    proxy_set_header Authorization "";
  }

  location = /api/assistant/chat {
    error_page 401 = @api_auth_required;
    proxy_pass http://host.docker.internal:8000/api/assistant/chat;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $portal_forwarded_proto;
    proxy_set_header X-User-Email __PORTAL_PRIVILEGED_EMAIL__;
    proxy_set_header X-User-Groups __PORTAL_PRIVILEGED_GROUPS__;
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-Groups "";
    proxy_set_header Authorization "";
  }

  location /api/ {
    error_page 401 = @api_auth_required;
    proxy_pass http://host.docker.internal:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $portal_forwarded_proto;
    proxy_set_header X-User-Email __PORTAL_API_EMAIL__;
    proxy_set_header X-User-Groups __PORTAL_API_GROUPS__;
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-Groups "";
    proxy_set_header Authorization "";
  }

  location /health {
    auth_request off;
    proxy_pass http://host.docker.internal:8000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-User-Email "";
    proxy_set_header X-User-Groups "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-Groups "";
    proxy_set_header Authorization "";
  }

  location /metrics {
    auth_request off;
    proxy_pass http://host.docker.internal:8000/metrics;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-User-Email "";
    proxy_set_header X-User-Groups "";
    proxy_set_header X-Auth-Request-Email "";
    proxy_set_header X-Auth-Request-Groups "";
    proxy_set_header Authorization "";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
